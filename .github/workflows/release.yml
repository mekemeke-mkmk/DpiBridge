# v から始まるタグ（例: v0.3.0）を push すると、テスト → exe をビルド → GitHub Release を作成する。
# アプリはこの Release を見て自動更新する。リリースノートは注釈付きタグのメッセージを使う。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test tests/DpiBridge.Core.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/DpiBridge.App -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:Version=$v -o publish
          $h = (Get-FileHash publish/DpiBridge.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("publish/DpiBridge.exe.sha256", "$h  DpiBridge.exe")

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" publish/DpiBridge.exe publish/DpiBridge.exe.sha256 `
            --title "DpiBridge ${{ github.ref_name }}" --notes-from-tag
